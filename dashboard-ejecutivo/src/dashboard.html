<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard Ejecutivo MKT SOC 2026</title>
<style>
/*__FONT__*/
:root {
  --brand: #006d4e; --brand-700: #00563d; --brand-800: #00402e; --brand-50: #eef6f2; --brand-100: #d7ebe3;
  --coral: #f4614a; --sky: #3bbfda; --lime: #5dc65e; --pink: #e84e8a;
  --ok-bg: #e5f5e5; --ok-fg: #1f6b2a; --ok-bd: #b7e2b8;
  --warn-bg: #fff4d4; --warn-fg: #7a5600; --warn-bd: #f3d98a;
  --bad-bg: #fde9e5; --bad-fg: #a8321d; --bad-bd: #f6c0b5;
  --info-bg: #e3f5fa; --info-fg: #0b6178; --info-bd: #b2e3ef;
  --pink-bg: #fce6ef; --pink-fg: #a3204f; --pink-bd: #f3bdd2;
  --gray-bg: #eef1f0; --gray-fg: #4a5753; --gray-bd: #d7dedb;
  --bg: #f6f8f7; --surface: #fff; --text: #13261f; --text-2: #4c5c56; --text-3: #74827d; --line: #e2e8e5; --line-2: #eef2f0;
  --radius: 12px; --shadow: 0 1px 2px rgba(16,40,31,.04), 0 4px 16px rgba(16,40,31,.05);
  --font: 'DM Sans Variable', 'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 14.5px; line-height: 1.45; color: var(--text); background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid rgba(59,191,218,.6); outline-offset: 2px; }

/* ── Encabezado ── */
.top { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { width: 42px; height: 42px; border-radius: 10px; background: #fff; color: var(--brand); display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; flex: none; }
.top-title { flex: 1; min-width: 240px; }
.top-title small { display: block; opacity: .8; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.top-title h1 { font-size: 20px; font-weight: 700; }
.corte { background: #fff; color: var(--brand-800); border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; display: flex; flex-direction: column; line-height: 1.2; }
.corte b { font-size: 15px; letter-spacing: 0; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.top .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); color: #fff; }
.top .btn:hover { background: rgba(255,255,255,.22); }

nav.tabs { background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; position: sticky; top: 0; z-index: 20; }
nav.tabs button { border: 0; background: none; padding: 13px 14px 11px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
nav.tabs button .n { color: var(--text-3); font-weight: 500; margin-right: 4px; }

.filterbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--line-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; color: var(--text-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.search { flex: 1; min-width: 200px; max-width: 380px; }
.save-state { margin-left: auto; font-size: 12px; color: var(--text-3); }
.save-state.bad { color: var(--bad-fg); font-weight: 700; }

main { padding: 20px 24px 60px; max-width: 1440px; margin: 0 auto; }
.mod-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.mod-head h2 { font-size: 22px; }
.mod-head p { margin: 4px 0 0; color: var(--text-2); max-width: 780px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card h3 { font-size: 15.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
table[data-table="partidas"] td:nth-child(2), table[data-table="saldos"] td:nth-child(2) { min-width: 210px; }
table[data-table="compromisos"] td:nth-child(3), table[data-table="decisiones"] td:first-child { min-width: 200px; }
.card .sub { color: var(--text-3); font-size: 12.5px; margin: 3px 0 10px; }
.section { margin-top: 16px; }
.kpi { position: relative; }
.kpi .lbl { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); font-weight: 700; }
.kpi .val { font-size: 26px; font-weight: 700; margin: 6px 0 2px; letter-spacing: -.01em; }
.kpi .hint { font-size: 12.5px; color: var(--text-3); }
.kpi .badge-wrap { margin-top: 10px; }
.kpi.accent { border-top: 3px solid var(--brand); }
.kpi.alert { border-top: 3px solid var(--coral); }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.neg { color: var(--bad-fg); font-weight: 700; }

/* ── Botones y campos ── */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-700); color: #fff; }
.btn-ghost { border-color: transparent; background: none; }
.btn-danger { color: var(--bad-fg); }
.btn-sm { padding: 4px 9px; font-size: 12.5px; }
.input, select.input, textarea.input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; width: 100%; }
textarea.input { min-height: 70px; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
label.f.err .input { border-color: var(--bad-fg); }
.ferr { color: var(--bad-fg); font-size: 12px; font-weight: 600; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form .full { grid-column: 1 / -1; }

/* ── Estados de validación ── */
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.st-CONFIRMADO { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }
.st-PENDIENTE { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
.st-PROPUESTA { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-bd); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.sem-ok { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bd); }
.sem-riesgo { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-bd); }
.sem-sobre { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-bd); }
.sem-sin { background: var(--gray-bg); color: var(--gray-fg); border-color: var(--gray-bd); }
.sem-conciliar { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-bd); }
.st-btn { border: 0; background: none; padding: 0; cursor: pointer; }

/* Filtro por estado: oculta lo que no coincide */
body[data-fe="CONFIRMADO"] [data-estado]:not([data-estado="CONFIRMADO"]),
body[data-fe="PENDIENTE"] [data-estado]:not([data-estado="PENDIENTE"]),
body[data-fe="PROPUESTA"] [data-estado]:not([data-estado="PROPUESTA"]) { display: none !important; }

/* ── Tablas ── */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); background: #fafcfb; position: sticky; top: 0; white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--brand); }
th .arrow { color: var(--brand); }
tr.total td { font-weight: 700; background: var(--brand-50); border-top: 2px solid var(--brand-100); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #f7fbf9; }
td.actions { white-space: nowrap; text-align: right; }
.empty { padding: 28px; text-align: center; color: var(--text-3); }

/* ── Barras ── */
.bar { position: relative; height: 10px; background: var(--line-2); border-radius: 999px; min-width: 120px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--brand); }
.bar > i.sobre { background: var(--coral); }
.bar > i.riesgo { background: #d99a00; }
.bar > i.conciliar { background: var(--sky); }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); border-radius: 2px; }
.stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; background: #fff; }
.stack > span { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 170px 1fr 90px; gap: 10px; align-items: center; margin: 7px 0; font-size: 13px; }
.hbar .bar { height: 14px; }

/* ── Gráficas SVG ── */
.chart { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { font-family: var(--font); fill: var(--text-3); font-size: 11px; }
.chart .lbl { fill: var(--text-2); font-weight: 600; }
.chart [data-tip] { cursor: default; }
.chart .hit { fill: transparent; }
#tip { position: fixed; pointer-events: none; z-index: 100; background: var(--text); color: #fff; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; white-space: pre-line; }

/* ── Avisos ── */
.note { border-radius: 10px; padding: 10px 12px; font-size: 13px; border: 1px solid var(--line); background: #fff; }
.note.warn { background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn-fg); }
.note.info { background: var(--info-bg); border-color: var(--info-bd); color: var(--info-fg); }
.note.bad { background: var(--bad-bg); border-color: var(--bad-bd); color: var(--bad-fg); }
.note.ok { background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok-fg); }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alerts li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.alerts li.sobre { background: var(--bad-bg); border-color: var(--bad-bd); }
.alerts li.riesgo { background: var(--warn-bg); border-color: var(--warn-bd); }
.alerts li.conciliar, .alerts li.info { background: var(--info-bg); border-color: var(--info-bd); }
.alerts li.sin { background: var(--gray-bg); border-color: var(--gray-bd); }
.ico { font-weight: 800; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: #fff; border: 1px solid currentColor; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-fg); }
.checks li.fail { background: var(--bad-bg); color: var(--bad-fg); }
.checks li.na { background: var(--gray-bg); color: var(--gray-fg); }
.metric { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
.metric div { background: var(--brand-50); border-radius: 10px; padding: 8px 10px; }
.metric b { display: block; font-size: 18px; }
.metric span { font-size: 11.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.periodo { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 700; color: var(--brand-800); background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: 6px; padding: 2px 8px; }
.src { font-size: 12px; color: var(--text-3); margin-top: 8px; }
.ger { border-top: 3px solid var(--sky); }
.ger .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.ger .nums div { text-align: center; background: var(--bg); border-radius: 8px; padding: 8px 4px; }
.ger .nums b { display: block; font-size: 20px; }
.ger .nums span { font-size: 11px; color: var(--text-2); text-transform: uppercase; font-weight: 700; }

/* ── Modal y aviso ── */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(760px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,30,22,.45); }
.dlg-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dlg-h h3 { font-size: 17px; }
.dlg-b { padding: 16px 20px; max-height: 70vh; overflow: auto; }
.dlg-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: #fafcfb; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--brand-800); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; display: none; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
#toast.bad { background: var(--bad-fg); }

@media (max-width: 1100px) { .g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) {
  .g2, .g3 { grid-template-columns: 1fr; }
  .form { grid-template-columns: 1fr; }
  main { padding: 16px; }
  .top, .filterbar { padding-left: 16px; padding-right: 16px; }
  .hbar { grid-template-columns: 120px 1fr 70px; }
}
@media print {
  nav.tabs, .filterbar, .top-actions, .no-print, td.actions, th.actions { display: none !important; }
  body { background: #fff; font-size: 12px; }
  .card { box-shadow: none; break-inside: avoid; }
  .top { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  main { padding: 10px; }
}
</style>
</head>

    <small>Dirección de Marketing y Posicionamiento · Ejercicio 2026</small>

</script>

</script>
</body>
