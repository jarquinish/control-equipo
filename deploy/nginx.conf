# Nginx: servir el build de producción (dist/) con fallback de SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca se cachea (para recibir nuevas versiones)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rutas de la SPA (/proyectos, /weekly/junta, …)
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
